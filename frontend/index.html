<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Proppros — rent, leases, tenants, maintenance and finances in one place." />
    <meta name="theme-color" content="#0d0e12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Proppros</title>
    <script>
      try {
        var t = localStorage.getItem("pp-theme");
        // Dark-first (Strata): Basalt unless the user chose Limestone.
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
